[package]
name = "mailidx"
version = "0.3.1"
edition = "2024"
description = "Fast Apple Mail MCP server for macOS: reads Mail's own index directly, full-text search in milliseconds"
license = "MIT"
repository = "https://github.com/jx-grxf/mailidx"
keywords = ["mcp", "apple-mail", "macos", "email", "claude"]
categories = ["command-line-utilities", "email"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
mail-parser = "1"
notify = "8"
percent-encoding = "2"
plist = "1"
rayon = "1"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "time", "sync"] }
toml = "1.1.8"
unicode-normalization = "0.1"
